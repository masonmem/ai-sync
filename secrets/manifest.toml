# Secrets manifest — tracked inventory of the gitignored files in secrets/.
#
# Modeled on homelab's komodo/resources/secrets-inventory.toml: this file is
# the single place that records WHICH secret files each machine needs and HOW
# to obtain each one. `ai-sync doctor` reads it and reports present / missing /
# loose-perms for every entry scoped to the current host (missing ⇒ exit 1),
# plus a warning for any file in secrets/ that no entry claims.
#
# Editing rules:
#   * Adding a secret file? Add a [[secret]] entry in the same commit, or
#     doctor warns about the unlisted file.
#   * NEVER put a secret VALUE in this file — names, hosts, and recipes only.
#
# Schema per [[secret]] entry:
#   file      basename under secrets/
#   hosts     short hostnames that need it; a machine absent from every list
#             (e.g. the work MacBook) simply doesn't get that file
#   consumer  what reads it
#   source    one-line recipe for obtaining/re-issuing it (doctor's fix hint)
#   perms     expected mode — always "600"
#
# Naming convention: `.env` for multi-var files that wrappers `source`;
# `.txt` for single-value tokens read whole.
#
# Sync between Macs: `secrets-push [host]` (push, no delete) or
# `secrets-push --pull <host>` (pull, newest-wins). See bin/secrets-push.

[meta]
schema_version = 1

[[secret]]
file = "github-mcp-pat.txt"
hosts = ["navi", "solaris"]
consumer = "dotfiles zsh/12-github-mcp.zsh → exports GITHUB_PERSONAL_ACCESS_TOKEN for the github plugin MCP (Claude Code)"
source = "mint: GitHub → Settings → Developer settings → fine-grained PAT (repo read scopes); paste the token into the file"
perms = "600"

[[secret]]
file = "kagi-mcp-key.txt"
hosts = ["navi", "solaris"]
consumer = "client copy of the bearer for the kagi mcpo stack on solaris (registration recipes in homelab docs/openwebui.md)"
source = "copy from another Mac: secrets-push --pull <host>; re-issue: openssl rand -hex 32, update KAGI_MCP_KEY periphery secret on solaris"
perms = "600"

[[secret]]
file = "komodo.env"
hosts = ["navi"]
consumer = "~/code/homelab scripts (komodo.py, periphery-secrets.py) — `source` it before running; only navi keeps a homelab clone"
source = "mint: Komodo UI → Settings → API Keys"
perms = "600"

[[secret]]
file = "litellm-aider.txt"
hosts = ["navi", "solaris"]
consumer = "dotfiles zsh/16-llm-gateway.zsh → AIDER_LITELLM_KEY (injected per-call by 60-aider-wrapper.zsh)"
source = "keychain: litellm-keys pull aider (or mint: litellm-keys mint aider)"
perms = "600"

[[secret]]
file = "litellm-goose.txt"
hosts = ["navi", "solaris"]
consumer = "dotfiles zsh/16-llm-gateway.zsh → GOOSE_LITELLM_KEY (injected per-call by 61-goose-wrapper.zsh)"
source = "keychain: litellm-keys pull goose (or mint: litellm-keys mint goose)"
perms = "600"

[[secret]]
file = "litellm-master-key.txt"
hosts = ["navi", "solaris"]
consumer = "litellm-keys mint/revoke + LiteLLM admin UI login — operator-only, never exported to client tools"
source = "keychain: litellm-keys pull master-key"
perms = "600"

[[secret]]
file = "litellm-opencode.txt"
hosts = ["navi", "solaris"]
consumer = "opencode.jsonc apiKey via {file:...} + 16-llm-gateway.zsh → OPENCODE_LITELLM_KEY"
source = "keychain: litellm-keys pull opencode (or mint: litellm-keys mint opencode)"
perms = "600"

[[secret]]
file = "litellm-openwebui.txt"
hosts = ["navi", "solaris"]
consumer = "operator copy of Open WebUI's LiteLLM virtual key (the live value is a periphery secret on solaris); in litellm-keys DEFAULT_TOOLS"
source = "keychain: litellm-keys pull openwebui (or mint: litellm-keys mint openwebui)"
perms = "600"

[[secret]]
file = "notes-git-mcp-key.txt"
hosts = ["navi", "solaris"]
consumer = "client copy of the bearer for the notes-git mcpo stack on solaris"
source = "copy from another Mac: secrets-push --pull <host>; re-issue: openssl rand -hex 32, update NOTES_GIT_MCP_KEY periphery secret on solaris"
perms = "600"

[[secret]]
file = "notes-mcp-key.txt"
hosts = ["navi", "solaris"]
consumer = "client copy of the bearer for the notes mcpo stack on solaris (OWUI tool server + claude.ai connector registration)"
source = "copy from another Mac: secrets-push --pull <host>; re-issue: openssl rand -hex 32, update NOTES_MCP_KEY periphery secret on solaris"
perms = "600"

[[secret]]
file = "owui-admin.txt"
hosts = ["navi", "solaris"]
consumer = "operator login / admin API scripts for Open WebUI (chat.hyperionx.dev)"
source = "reset: Open WebUI → Settings → Account, then update this file"
perms = "600"

[[secret]]
file = "unifi-mcp-key.txt"
hosts = ["navi", "solaris"]
consumer = "client copy of the bearer for the unifi mcpo stack on solaris"
source = "copy from another Mac: secrets-push --pull <host>; re-issue: openssl rand -hex 32, update UNIFI_MCP_KEY periphery secret on solaris"
perms = "600"

[[secret]]
file = "unifi.env"
hosts = ["navi", "solaris"]
consumer = "bin/unifi-mcp-wrapper.sh (declared as secrets_env in mcp/servers.toml [unifi])"
source = "mint: UniFi Site Manager → API → create API key; see unifi-mcp-wrapper.sh header for required vars"
perms = "600"

[[secret]]
file = "ynab.env"
hosts = ["navi"]
consumer = "bin/ynab-mcp-wrapper.sh (declared as secrets_env in mcp/servers.toml [ynab])"
source = "mint: YNAB → Account Settings → Developer Settings → New Token; sets YNAB_API_TOKEN (see ynab-mcp-wrapper.sh header)"
perms = "600"

[[secret]]
file = "context7.env"
hosts = ["navi", "solaris"]
consumer = "bin/context7-mcp-wrapper.sh (declared as secrets_env in mcp/servers.toml [context7])"
source = "mint: https://context7.com/dashboard → API key; sets CONTEXT7_API_KEY (see context7-mcp-wrapper.sh header)"
perms = "600"
