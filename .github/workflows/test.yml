name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run ai-sync test suite
        run: pytest tests/ -v

  ai-sync-status-smoke:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up fake home tree
        run: |
          mkdir -p $HOME/.claude $HOME/.copilot
          chmod +x bin/ai-sync

      - name: ai-sync --help works
        run: ./bin/ai-sync --help

      - name: ai-sync apply succeeds against the real repo
        run: AI_CONFIG=$PWD ./bin/ai-sync apply

      - name: ai-sync status is clean after apply
        run: AI_CONFIG=$PWD ./bin/ai-sync status

      - name: tree stays clean after apply (mcp.json is generated + gitignored)
        run: |
          git diff --exit-code
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "apply dirtied the tree:"; echo "$status"; exit 1
          fi
